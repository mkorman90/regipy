name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: write  # Needed to attach assets to release

jobs:
  build:
    # regipy-rs releases (tags `regipy-rs-*`) are published by
    # regipy-rs.yml; this workflow covers the Python package only. Without
    # this filter every rust release would also rebuild and re-publish the
    # Python package (a no-op only thanks to `skip-existing`), and attach
    # the SBOM to the rust release. `publish` needs this job, so a skipped
    # build skips the whole workflow.
    if: >-
      github.event_name == 'release' &&
      !startsWith(github.event.release.tag_name, 'regipy-rs-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build cyclonedx-bom

      - name: Build package
        run: python -m build

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install -e ".[full]"
          cyclonedx-py environment -o sbom.json --of JSON
          cyclonedx-py environment -o sbom.xml --of XML

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
      contents: write  # Required to attach assets to release

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/

      # Uses trusted publishing if configured, otherwise falls back to token
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Fallback to API token if trusted publishing is not configured.
          # See https://pypi.org/manage/account/publishing/ to set it up.
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Attach SBOM to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom/sbom.json
            sbom/sbom.xml

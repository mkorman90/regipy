name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: uv venv

      - name: Install ruff
        run: uv pip install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install -e ".[full,dev]"

      - name: Run tests with pytest
        run: pytest -v regipy_tests/tests.py

      - name: Run CLI tests
        run: pytest -v regipy_tests/cli_tests.py

      - name: Run packaging tests
        run: pytest -v regipy_tests/test_packaging.py

      - name: Run plugin validation
        run: PYTHONPATH=. python regipy_tests/validation/plugin_validation.py

  validation-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[full,dev]"

      - name: Generate plugin validation documentation
        run: PYTHONPATH=. python regipy_tests/validation/plugin_validation.py

      - name: Upload validation documentation
        uses: actions/upload-artifact@v7
        with:
          name: plugin-validation-docs
          path: regipy_tests/validation/plugin_validation.md

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: uv pip install -e ".[full,dev]"

      - name: Run mypy
        run: mypy regipy/ --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          # setuptools upgraded explicitly: pip-audit scans the environment,
          # and the runner's bundled setuptools is periodically flagged
          # (e.g. PYSEC-2026-3447).
          uv pip install -e ".[full,dev]"
          uv pip install pip-audit cyclonedx-bom

      - name: Run pip-audit (vulnerability scan)
        run: pip-audit --skip-editable

      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py environment -o sbom.json --of JSON
          cyclonedx-py environment -o sbom.xml --of XML

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.json
            sbom.xml

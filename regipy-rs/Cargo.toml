[package]
name = "regipy-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated Windows registry hive (REGF) parser core for regipy"
license = "MIT"

[lib]
name = "regipy_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
